<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safe Soundboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Sound Effects Soundboard</h1>
    <p>Click a button to play a sound!</p>

    <div class="buttons">
      <button data-sound="https://www.myinstants.com/media/sounds/vine-boom.mp3">Vine Boom</button>
      <button data-sound="https://www.myinstants.com/media/sounds/among-us-role-reveal.mp3">Among Us Role Reveal</button>
      <button data-sound="https://www.myinstants.com/media/sounds/punch-sound.mp3">Punch Sound</button>
      <button data-sound="https://www.myinstants.com/media/sounds/power-up.mp3">Power Up</button>
      <button data-sound="https://www.myinstants.com/media/sounds/wrong-answer-fail-buzzer.mp3">Wrong Answer Buzzer</button>
      <button data-sound="https://www.myinstants.com/media/sounds/error.mp3">Error Sound</button>
      <button data-sound="https://www.myinstants.com/media/sounds/mario-jump-sound.mp3">Mario Jump</button>
      <button data-sound="https://www.myinstants.com/media/sounds/discord-notification.mp3">Discord Notification</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
